[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name="nfl-picks"
version="1.0.0"
requires-python=">=3.11"
dependencies=["pandas","numpy","scikit-learn","xgboost","joblib","typer","rich","requests"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nfl-picks="nfl_picks.cli:app"
